<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<div class="container">
    <form id="miFormulario">
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre">
        <div id="nombreError" class="form-text text-danger"></div>
    </div>

    <div class="mb-3">
        <label for="usuario" class="form-label">Usuario:</label>
        <input type="text" class="form-control" id="usuario">
        <div id="usuarioError" class="form-text text-danger"></div>
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
            <input type="password" class="form-control" id="password">
            <button class="btn btn-outline-secondary" type="button" id="togglePassword">Mostrar</button>
        </div>
        <div id="passwordError" class="form-text text-danger"></div>
    </div>

    <button type="submit" class="btn btn-primary">ENVIAR</button>
    <div id="formMessage" class="form-text"></div>
</form>
</div>

<script src="validacion.js"></script>
